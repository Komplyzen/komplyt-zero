name: Staging Deploy

on:
  pull_request:
    paths:
      - 'src/**'
      - 'database/**'
      - '.github/workflows/notify-staging.yml'

concurrency:
  group: staging-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    # Same-repo only (security: don't deploy fork code without review)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.KOMPLYT_CI_APP_ID }}
          private-key: ${{ secrets.KOMPLYT_CI_PRIVATE_KEY }}
          repositories: komplyzen-platform,komplyt-zero

      - name: Post pending status
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: 'Komplyzen',
              repo: 'komplyt-zero',
              sha: context.payload.pull_request.head.sha,
              state: 'pending',
              context: 'staging-deploy',
              description: 'Staging deployment queued...'
            });

      - name: Validate ref
        env:
          REF: ${{ github.head_ref }}
        run: |
          REF="$REF"
          if ! echo "$REF" | grep -qE '^[a-zA-Z0-9/_.-]+$'; then
            echo "::error::Invalid ref format: $REF"
            exit 1
          fi

      - name: Dispatch to private repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: Komplyzen/komplyzen-platform
          event-type: kg-deploy
          client-payload: |
            {
              "ref": ${{ toJSON(github.head_ref) }},
              "sha": "${{ github.event.pull_request.head.sha }}",
              "pr": "${{ github.event.pull_request.number }}",
              "environment": "staging"
            }
