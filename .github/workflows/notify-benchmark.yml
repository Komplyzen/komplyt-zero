name: Benchmarks

on:
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/notify-benchmark.yml'

concurrency:
  group: benchmark-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dispatch:
    # Same-repo only (benchmarks need DB access). Not for Dependabot PRs (unreviewed upstream content).
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref || github.ref_name, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.KOMPLYT_CI_APP_ID }}
          private-key: ${{ secrets.KOMPLYT_CI_PRIVATE_KEY }}
          repositories: komplyzen-platform,komplyt-zero

      - name: Post pending status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: 'Komplyzen',
              repo: 'komplyt-zero',
              sha: context.payload.pull_request.head.sha,
              state: 'pending',
              context: 'benchmarks',
              description: 'Performance benchmarks queued...'
            });

      - name: Validate ref
        env:
          REF: ${{ github.head_ref }}
        run: |
          REF="$REF"
          if ! echo "$REF" | grep -qE '^[a-zA-Z0-9/_.-]+$'; then
            echo "::error::Invalid ref format: $REF"
            exit 1
          fi

      - name: Dispatch to private repo
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: Komplyzen/komplyzen-platform
          event-type: kg-benchmark
          client-payload: |
            {
              "ref": ${{ toJSON(github.head_ref) }},
              "sha": "${{ github.event.pull_request.head.sha }}",
              "pr": "${{ github.event.pull_request.number }}"
            }
