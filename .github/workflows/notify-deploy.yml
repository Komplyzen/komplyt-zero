name: Production Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'database/**'

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.KOMPLYT_CI_APP_ID }}
          private-key: ${{ secrets.KOMPLYT_CI_PRIVATE_KEY }}
          repositories: komplyzen-platform,komplyt-zero

      - name: Post pending status
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: 'Komplyzen',
              repo: 'komplyt-zero',
              sha: context.sha,
              state: 'pending',
              context: 'production-deploy',
              description: 'Production deployment queued...'
            });

      - name: Validate ref
        env:
          REF: ${{ github.ref_name }}
        run: |
          REF="$REF"
          if [ "$REF" != "main" ]; then
            echo "::error::Production deploy only allowed from main branch, got: $REF"
            exit 1
          fi

      - name: Dispatch to private repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: Komplyzen/komplyzen-platform
          event-type: kg-deploy
          client-payload: |
            {
              "ref": "main",
              "sha": "${{ github.sha }}",
              "environment": "production"
            }
