name: /ok-to-test

# Triggered when a maintainer comments `/ok-to-test <reviewed-sha>` on a fork PR or a
# Dependabot PR. Both are untrusted: neither gets the private integration run automatically.
# The sha pins what was reviewed; a push after review invalidates the comment.
# The approval re-uses the normal pipeline: it sends the same `kg-integration` event as
# notify-private.yml, with the reviewed commit. The private kg-ci checks out exactly that
# SHA (a later push cannot change what runs), provisions the run-scoped database and reports
# `integration-tests` on it.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  dispatch:
    # Only run on PR comments (not issues) that START with /ok-to-test, from
    # maintainers. The exact `/ok-to-test <sha>` form is enforced in the script.
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/ok-to-test') &&
      (github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.KOMPLYT_CI_APP_ID }}
          private-key: ${{ secrets.KOMPLYT_CI_PRIVATE_KEY }}
          repositories: komplyzen-platform,komplyt-zero

      - name: Get PR details
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            // Same-repo PRs run integration automatically, except Dependabot's: its content comes
            // from upstream registries, so a maintainer reads the diff and approves the run.
            const sameRepo = pr.data.head.repo && pr.data.head.repo.full_name === pr.data.base.repo.full_name;
            const dependabot = pr.data.user.login === 'dependabot[bot]';
            if (sameRepo && !dependabot) {
              core.setFailed('This PR is from the same repo - integration tests run automatically');
              return;
            }

            // Pin the approval to the commit the maintainer reviewed. The comment
            // must be exactly `/ok-to-test <sha>` (7-40 hex chars). If the fork
            // pushed since, the head no longer matches and nothing is dispatched.
            const body = context.payload.comment.body.trim();
            const m = /^\/ok-to-test\s+([0-9a-f]{7,40})$/i.exec(body);
            const head = pr.data.head.sha.toLowerCase();
            if (!m) {
              core.setFailed('Comment must be exactly "/ok-to-test <reviewed-commit-sha>"');
              return;
            }
            if (!head.startsWith(m[1].toLowerCase())) {
              core.setFailed(`Reviewed sha ${m[1]} does not match the current PR head ${head}; re-review and comment again`);
              return;
            }

            core.setOutput('sha', head);
            core.setOutput('number', pr.data.number);
            // Only names the run (concurrency group). Fork branches do not exist here, so they
            // get a synthetic name; kg-ci checks out the sha, not the ref.
            core.setOutput('ref', sameRepo ? pr.data.head.ref : `ok-to-test/pr-${pr.data.number}`);
            console.log(`${dependabot ? 'Dependabot' : 'Fork'} PR #${pr.data.number} from ${pr.data.head.repo.full_name}`);

      - name: React to comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Post pending status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.pr.outputs.sha }}',
              state: 'pending',
              context: 'integration-tests',
              description: 'Integration tests queued (approved with /ok-to-test)...'
            });

      - name: Dispatch to private repo
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: Komplyzen/komplyzen-platform
          event-type: kg-integration
          client-payload: |
            {
              "ref": ${{ toJSON(steps.pr.outputs.ref) }},
              "sha": "${{ steps.pr.outputs.sha }}",
              "pr": "${{ steps.pr.outputs.number }}"
            }
